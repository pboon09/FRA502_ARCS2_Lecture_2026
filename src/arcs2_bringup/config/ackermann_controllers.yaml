controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

ackermann_steering_controller:
  ros__parameters:
    front_wheels_names: [front_left_steering_joint, front_right_steering_joint]
    rear_wheels_names: [rear_left_wheel_joint, rear_right_wheel_joint]

    wheelbase: 0.35
    front_wheel_track: 0.34
    rear_wheel_track: 0.34
    front_wheels_radius: 0.08
    rear_wheels_radius: 0.08

    odom_frame_id: odom
    base_frame_id: base_link
    enable_odom_tf: false
